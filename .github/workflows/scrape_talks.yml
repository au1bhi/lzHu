name: Scrape Talk Locations

on:
  push:
    paths:
      - 'talks/**'
      - '_talks/**'
      - 'talkmap.ipynb'

permissions:
  contents: read

concurrency:
  group: scrape-talk-locations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: .github/requirements-talkmap.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip==26.2.1
        python -m pip install --requirement .github/requirements-talkmap.txt

    - name: Run Jupyter Notebook
      run: jupyter nbconvert --to notebook --execute talkmap.ipynb --output talkmap_out.ipynb

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add talkmap/org-locations.js talkmap_out.ipynb
        git commit -m "Automated update of talk locations" || echo "No changes to commit"
        git push
