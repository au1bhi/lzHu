{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f5">

<script>
  (function () {
    var root = document.documentElement, theme = null;
    root.className = root.className.replace(/\bno-js\b/g, '') + ' js';
    try { theme = localStorage.getItem('theme'); } catch (e) { theme = null; }
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    root.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) { meta.setAttribute('content', theme === 'dark' ? '#151412' : '#faf9f5'); }
  })();
</script>

<link rel="preload" href="{{ base_path }}/assets/fonts/site-serif-roman.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base_path }}/assets/fonts/site-sans-roman.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">

<script type="speculationrules">
  {"prefetch": [{"where": {"and": [{"href_matches": "/*"}, {"not": {"href_matches": "/assets/*"}}, {"not": {"href_matches": "/files/*"}}]}, "eagerness": "moderate"}]}
</script>
